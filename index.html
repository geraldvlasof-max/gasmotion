<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gasmotion</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://gasmotion-worker.geraldvlasof.workers.dev/">
<link rel="canonical" href="https://gasmotion-worker.geraldvlasof.workers.dev/">
<style>
  :root { --fondo: #f6f7f9; --texto: #1d2430; --enlace: #0b5cad; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #12161c; --texto: #e6e9ee; --enlace: #7db4ff; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--fondo); color: var(--texto); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 0 16px; text-align: center; }
  a { color: var(--enlace); }
</style>
<script>
  // v5.95: este panel se mudó al worker (inicio de sesión con usuario y contraseña,
  // sin claves en la página). Se borra el Service Worker y la caché del panel viejo.
  (function () {
    var destino = 'https://gasmotion-worker.geraldvlasof.workers.dev/';
    var tareas = [];
    try {
      if ('serviceWorker' in navigator) {
        tareas.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches) {
        tareas.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      }
      try { localStorage.removeItem('gmKey'); localStorage.removeItem('agendaKey'); } catch (e) {}
    } catch (e) {}
    var ir = function () { location.replace(destino); };
    Promise.all(tareas).then(ir, ir);
    setTimeout(ir, 1500);
  })();
</script>
</head>
<body>
  <p>Gasmotion ahora está en <a href="https://gasmotion-worker.geraldvlasof.workers.dev/">gasmotion-worker.geraldvlasof.workers.dev</a>.<br>Te llevamos en un momento.</p>
</body>
</html>
